<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#store" data-route="store">Dealer Store</a>
    <nav>
      <button class="nav-button" data-route="store">Store</button>
      <button class="nav-button signed-out" data-route="login">Login</button>
      <button class="nav-button signed-out" data-route="register">Register</button>
      <button class="nav-button admin-only hidden" data-route="admin">Admin</button>
      <button class="nav-button signed-in hidden" id="logoutButton">Logout</button>
    </nav>
  </header>

  <main>
    <section id="storeView" class="view">
      <div class="section-head">
        <div>
          <p class="eyebrow">Dealer catalog</p>
          <h1>Browse products built for resale.</h1>
        </div>
        <p class="price-note" id="priceNote">Login after approval to see dealer pricing.</p>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <section id="loginView" class="view hidden">
      <form class="panel auth-panel" id="loginForm">
        <h2>Dealer login</h2>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
        <button class="primary" type="submit">Login</button>
        <p class="form-message" id="loginMessage"></p>
      </form>
    </section>

    <section id="registerView" class="view hidden">
      <form class="panel auth-panel" id="registerForm">
        <h2>Request dealer access</h2>
        <label>Company<input name="company" required></label>
        <label>Contact name<input name="contactName" required autocomplete="name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Phone<input name="phone" autocomplete="tel"></label>
        <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button class="primary" type="submit">Register</button>
        <p class="form-message" id="registerMessage"></p>
      </form>
    </section>

    <section id="adminView" class="view hidden">
      <div class="section-head compact">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>Approve dealers and manage products.</h1>
        </div>
      </div>
      <div class="stats" id="adminStats"></div>
      <div class="admin-layout">
        <section class="panel">
          <h2>Dealer approvals</h2>
          <div id="usersList" class="stack"></div>
        </section>
        <section class="panel">
          <h2>Add product</h2>
          <form id="productForm" class="product-form">
            <label>Name<input name="name" required></label>
            <label>SKU<input name="sku"></label>
            <label>UPC<input name="upc" inputmode="numeric"></label>
            <label>Category<input name="category"></label>
            <label>Price<input name="price" type="number" min="0" step="0.01" required></label>
            <label>Description<textarea name="description" rows="4"></textarea></label>
            <label>Image<input name="image" type="file" accept="image/*"></label>
            <button class="primary" type="submit">Add product</button>
          </form>
        </section>
        <section class="panel wide">
          <h2>Products</h2>
          <div id="adminProducts" class="stack"></div>
        </section>
        <section class="panel wide">
          <h2>Dealer inquiries</h2>
          <div id="inquiriesList" class="stack"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
