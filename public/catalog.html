<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the selltomakemoney.com public catalog for scooters, electronics, inventory finds, and dealer-ready items with visible pricing.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#131921">
  <link rel="canonical" href="https://selltomakemoney.com/catalog">
  <meta property="og:site_name" content="selltomakemoney.com">
  <meta property="og:type" content="website">
  <meta property="og:title" content="selltomakemoney.com Catalog | Public Deals and Inventory">
  <meta property="og:description" content="Search active inventory, view public pricing, and request checkout from selltomakemoney.com.">
  <meta property="og:url" content="https://selltomakemoney.com/catalog">
  <meta name="twitter:card" content="summary">
  <title>selltomakemoney.com Catalog | Public Deals and Inventory</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "selltomakemoney.com Catalog",
      "url": "https://selltomakemoney.com/catalog",
      "description": "Public catalog of available selltomakemoney.com inventory."
    }
  </script>
  <link rel="stylesheet" href="/styles.css?v=product-pages-1">
</head>
<body class="catalog-page">
  <header class="topbar catalog-topbar">
    <a class="brand" href="/mobile" aria-label="selltomakemoney.com home">
      <img src="/assets/logo.svg?v=product-pages-1" alt="selltomakemoney.com">
    </a>
    <nav>
      <a class="nav-button" href="/mobile">Store</a>
      <a class="nav-button primary" href="/mobile#register">Request Access</a>
    </nav>
  </header>

  <main>
    <section class="catalog-hero">
      <p class="eyebrow">Shareable catalog</p>
      <h1>Public inventory catalog.</h1>
      <p>Browse available items, public prices, and retail comparison links. Request checkout from the main store for pickup or shipping.</p>
      <div class="catalog-actions">
        <a class="nav-button primary" href="/mobile#register">Request dealer access</a>
        <a class="nav-button" href="/mobile">Open store</a>
      </div>
    </section>

    <section class="catalog-tools" aria-label="Catalog filters">
      <label>Search catalog<input id="catalogSearch" type="search" placeholder="Search by name, brand, SKU, UPC"></label>
      <label>Category<select id="catalogCategory"><option value="">All categories</option></select></label>
    </section>

    <section>
      <div id="catalogStatus" class="app-status" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading catalog...</span>
      </div>
      <div class="product-grid catalog-grid" id="catalogGrid"></div>
    </section>
  </main>

  <script src="/catalog.js?v=product-pages-1"></script>
</body>
</html>
